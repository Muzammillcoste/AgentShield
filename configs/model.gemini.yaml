# Real provider: Google Gemini via its OpenAI-compatible endpoint (native tool calling).
# Key: GEMINI_KEY in the local .env. Model chosen by the owner (2026-10-17): gemini-2.5-flash
# (GEMINI_MODEL in the environment overrides nothing: model_id below is explicit).
provider: openai_compatible
base_url: https://generativelanguage.googleapis.com/v1beta/openai/
model_id: gemini-2.5-flash
api_key_env: GEMINI_KEY
max_tokens_param: max_tokens
generation:
  temperature: 0.0
  max_output_tokens: 1024
  timeout_s: 90
  tool_choice: auto
# Instruct mode, matching the Qwen setup (D-027): 2.5 Flash accepts reasoning_effort "none".
extra_body:
  reasoning_effort: "none"
max_rate_limit_wait_s: 90
